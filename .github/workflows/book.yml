name: Daily Gym Booking (Backup & Keep-Alive)

on:
  schedule:
    # Primary booking fires at 07:01:00 Europe/Rome via Supabase pg_cron + pg_net.
    # This single daily run (07:17 UTC = 08:17 CET / 09:17 CEST) acts as:
    # 1. External API traffic to prevent Supabase Free Tier 7-day inactivity pause
    # 2. Backup retry if the 07:01 run encountered a transient gym portal outage
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulate booking without submitting reservations or updating daily locks"
        type: boolean
        default: false
      force_time:
        description: "Bypass the >= 07:00 Europe/Rome time gate (useful for manual dry-run testing)"
        type: boolean
        default: false

jobs:
  book:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DRY_RUN: ${{ inputs.dry_run || false }}
      FORCE_TIME: ${{ inputs.force_time || false }}
    steps:
      - name: Verify required secrets
        run: |
          missing=()
          [ -z "$SUPABASE_PROJECT_REF" ] && missing+=("SUPABASE_PROJECT_REF")
          [ -z "$CRON_SECRET" ] && missing+=("CRON_SECRET")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${missing[*]}. Configure them in Settings -> Secrets and variables -> Actions (see docs/MAINTAINER.md)."
            exit 1
          fi

      - name: Invoke gym-auto-book Edge Function
        run: |
          url="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/gym-auto-book"
          payload=$(printf '{"dryRun":%s,"forceTime":%s}' "$DRY_RUN" "$FORCE_TIME")
          response=$(curl --silent --show-error --fail-with-body --max-time 150 \
            -X POST "$url" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$payload")
          echo "$response"
