openapi: 3.0.3
info:
  title: InfoYou TeamSystem — External Gym Portal API (Subset Used by Gym Bot)
  version: 1.0.0
  description: >
    Reverse-engineered subset of the external InfoYou TeamSystem web booking API consumed by
    `supabase/functions/_shared/gymClient.ts` (Deno).

    Every request requires the portal `AppToken` and legacy `IYESUrl` in both HTTP headers
    and the `Cookie` header. Authenticated requests additionally require `AuthToken`.
servers:
  - url: https://inforyou.teamsystem.com/dream/api/v1
    description: InfoYou TeamSystem production API

tags:
  - name: Security
    description: Session authentication and password management
  - name: User
    description: General user status endpoints (reference/discovered, not yet consumed by Gym Bot)
  - name: WebUser
    description: Authenticated user profile and account endpoints (reference/discovered, not yet consumed by Gym Bot)
  - name: WebEPurse
    description: Electronic purse and movement history endpoints (reference/discovered, not yet consumed by Gym Bot)
  - name: WebBooking
    description: Services, schedule lookup, user bookings, and reservations

components:
  securitySchemes:
    GymAuthToken:
      type: apiKey
      in: header
      name: AuthToken
      description: Session token returned in `Item` by `/security/webauthenticate`.

  parameters:
    AppTokenHeader:
      name: AppToken
      in: header
      required: true
      schema:
        type: string
      description: Portal application token (configurable via `GYM_APP_TOKEN`).
    IyesUrlHeader:
      name: IYESUrl
      in: header
      required: true
      schema:
        type: string
        example: http://95.130.140.135:65432
      description: Legacy backend host required by the portal.

  schemas:
    PortalEnvelope:
      type: object
      properties:
        Successful:
          type: boolean
        Result:
          type: string
          nullable: true
          example: "0"
        ErrorMessage:
          type: string
          nullable: true
        Comment:
          type: string
          nullable: true

    AuthenticateResponse:
      allOf:
        - $ref: '#/components/schemas/PortalEnvelope'
        - type: object
          properties:
            Item:
              type: string
              description: AuthToken string to send on subsequent requests

    ListWithMineRequest:
      type: object
      required: [CompanyID, Types, StartDate, EndDate, TimeStart, TimeEnd]
      properties:
        CompanyID:
          type: integer
          example: 2
        Types:
          type: array
          items:
            type: integer
          example: []
        StartDate:
          type: string
          description: Local ISO timestamp without timezone offset
          example: "2026-05-01T00:00:00"
        EndDate:
          type: string
          example: "2026-05-20T00:00:00"
        TimeStart:
          type: string
          example: "2026-05-01T07:00:00"
        TimeEnd:
          type: string
          example: "2026-05-01T23:59:59"

    PortalLessonItem:
      type: object
      properties:
        IDLesson:
          type: integer
        IDServizio:
          type: integer
        DateLesson:
          type: string
          example: "2026-05-20T00:00:00"
        StartTime:
          type: string
          example: "1900-01-01T18:00:00"
        EndTime:
          type: string
          example: "1900-01-01T19:00:00"
        ServiceDescription:
          type: string
          example: PILATES
        CategoryDescription:
          type: string
          example: CORSI FIT
        AvailablePlaces:
          type: integer
        IsUserPresent:
          type: integer
          description: 1 if booked, 0 otherwise
        UserPositionWaitingList:
          type: integer
          description: Waitlist position (> 0 if on waitlist, 0 otherwise)
        MaxPrenotazioni:
          type: integer
        WebMaxPostiUtente:
          type: integer
        IsLocked:
          type: integer

    ListWithMineResponse:
      allOf:
        - $ref: '#/components/schemas/PortalEnvelope'
        - type: object
          properties:
            Items:
              type: array
              items:
                $ref: '#/components/schemas/PortalLessonItem'

    MyBooksItem:
      type: object
      properties:
        BookingID:
          type: integer
        IDLesson:
          type: integer
        Type:
          type: integer
        IDDurata:
          type: integer
        StartTime:
          type: string
          example: "2026-05-20T18:00:00"
        EndTime:
          type: string
          example: "2026-05-20T19:00:00"
        IsUserPresent:
          type: integer
        UserPositionWaitingList:
          type: integer
        ServiceDescription:
          type: string
        CategoryDescription:
          type: string
        AdditionalInfo:
          type: string

    MyBooksResponse:
      allOf:
        - $ref: '#/components/schemas/PortalEnvelope'
        - type: object
          properties:
            Items:
              type: array
              items:
                $ref: '#/components/schemas/MyBooksItem'

    BookOrWaitPayload:
      type: object
      required: [BookingID, StartTime, EndTime, IDLesson]
      properties:
        Note:
          type: string
          default: ""
        BookNr:
          type: integer
          default: 0
        BookingID:
          type: integer
          description: Maps to `IDServizio` from `listwithmine`
        StartTime:
          type: string
          example: "2026-05-20T18:00:00"
        EndTime:
          type: string
          example: "2026-05-20T19:00:00"
        IDLesson:
          type: integer
        Type:
          type: integer
          default: 0
        IDDurata:
          type: integer
          default: 0

    CancelOrRemoveWaitPayload:
      type: object
      required: [BookingID, StartTime, EndTime]
      properties:
        BookingID:
          type: integer
          description: Booking identifier returned by `mybooks`
        IDLesson:
          type: integer
          default: 0
        Type:
          type: integer
          default: 0
        StartTime:
          type: string
          example: "2026-05-20T18:00:00"
        EndTime:
          type: string
          example: "2026-05-20T19:00:00"
        IDDurata:
          type: integer
          default: 0

    WebUserMeItem:
      type: object
      properties:
        UserID:
          type: integer
          example: 12345
        LastName:
          type: string
          example: Rossi
        FirstName:
          type: string
          example: Mario
        Street:
          type: string
          nullable: true
        CivicNumber:
          type: string
          nullable: true
        Province:
          type: string
          nullable: true
        City:
          type: string
          nullable: true
        ZipCode:
          type: string
          nullable: true
        Country:
          type: string
          nullable: true
        FiscalCode:
          type: string
          nullable: true
        Phone1:
          type: string
          nullable: true
        Phone2:
          type: string
          nullable: true
        Mobile:
          type: string
          nullable: true
        Email:
          type: string
          nullable: true
        Gender:
          type: string
          nullable: true
          example: M
        BirthPlace:
          type: string
          nullable: true
        BirthDate:
          type: string
          nullable: true
          example: "1990-01-15T00:00:00"
        BirthProvince:
          type: string
          nullable: true
        BirthCountry:
          type: string
          nullable: true
        Occupation:
          type: string
          nullable: true
        Note:
          type: string
          nullable: true
        Source:
          type: string
          nullable: true
        WebLogin:
          type: string
          nullable: true
        WebPassword:
          type: string
          nullable: true
        ReceiptFiscalCode:
          type: string
          nullable: true
        ReceiptName:
          type: string
          nullable: true
        AllowPaper:
          type: boolean
        AllowEMail:
          type: boolean
        AllowSMS:
          type: boolean
        Custom1:
          type: string
          nullable: true
        Custom2:
          type: string
          nullable: true
        Custom3:
          type: string
          nullable: true
        Custom4:
          type: string
          nullable: true
        IDReferral:
          type: integer
          nullable: true
        AgreeContract:
          type: boolean
          nullable: true
        AgreeRule:
          type: boolean
          nullable: true
        AgreePrivacy:
          type: boolean
          nullable: true
        GoogleUserId:
          type: string
          nullable: true
        FacebookUserId:
          type: string
          nullable: true
        AuthToken:
          type: string
          nullable: true
        CurrentCompanyID:
          type: integer
          nullable: true
        GympassID:
          type: string
          nullable: true
        PermanentTokenTG:
          type: string
          nullable: true

    WebUserMeResponse:
      allOf:
        - $ref: '#/components/schemas/PortalEnvelope'
        - type: object
          properties:
            Item:
              $ref: '#/components/schemas/WebUserMeItem'

    UserStatusNode:
      type: object
      properties:
        Text:
          type: string
          example: Documento Informativo
        Contents:
          type: array
          items:
            $ref: '#/components/schemas/UserStatusNode'

    UserMyStatusResponse:
      allOf:
        - $ref: '#/components/schemas/PortalEnvelope'
        - type: object
          properties:
            Item:
              $ref: '#/components/schemas/UserStatusNode'

    EPurseMovementItem:
      type: object
      properties:
        EPurseName:
          type: string
          example: BORSELLINO GENERALE
        Cause:
          type: string
          example: "PRENOTAZIONE OMAGGIO: PILATES del 17/12/2026 19:00:00"
        MovementDateTime:
          type: string
          example: "2026-11-28T07:01:06"
        Amount:
          type: number
          example: 0.0
        GiftAmount:
          type: number
          example: 0.0
        ResidualAmount:
          type: number
          example: 0.0
        Balance:
          type: number
          example: 0.0
        ServiceType:
          type: string
          example: P
        IsPoints:
          type: boolean
        PointValue:
          type: number
          nullable: true

    EPurseMovementsResponse:
      allOf:
        - $ref: '#/components/schemas/PortalEnvelope'
        - type: object
          properties:
            Items:
              type: array
              items:
                $ref: '#/components/schemas/EPurseMovementItem'

    EPurseItem:
      type: object
      properties:
        UserEPurseID:
          type: integer
          example: 20919
        Code:
          type: string
          example: "1-20919"
        Description:
          type: string
          example: BORSELLINO GENERALE
        EPurseID:
          type: integer
          example: 1
        Balance:
          type: number
          example: 0.0
        ExpireDate:
          type: string
          nullable: true
        IsPoints:
          type: boolean
        PointValue:
          type: number
          nullable: true

    MyEPursesResponse:
      allOf:
        - $ref: '#/components/schemas/PortalEnvelope'
        - type: object
          properties:
            Items:
              type: array
              items:
                $ref: '#/components/schemas/EPurseItem'

paths:
  /security/webauthenticate:
    get:
      tags: [Security]
      summary: Authenticate user and obtain AuthToken
      description: >
        Provider-defined GET endpoint that returns a session token in `Item`.
        Never log the full request URL because `password` is sent as a query parameter.
      parameters:
        - $ref: '#/components/parameters/AppTokenHeader'
        - $ref: '#/components/parameters/IyesUrlHeader'
        - name: login
          in: query
          required: true
          schema:
            type: string
        - name: password
          in: query
          required: true
          schema:
            type: string
            format: password
        - name: companyid
          in: query
          required: true
          schema:
            type: integer
            example: 2
        - name: confirmlink
          in: query
          required: true
          schema:
            type: string
            example: https://inforyou.teamsystem.com/dream/account-verification/
      responses:
        '200':
          description: Authentication result envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticateResponse'

  /security/changepassword:
    get:
      tags: [Security]
      summary: Change the authenticated user's gym portal password
      security:
        - GymAuthToken: []
      parameters:
        - $ref: '#/components/parameters/AppTokenHeader'
        - $ref: '#/components/parameters/IyesUrlHeader'
        - name: oldpwd
          in: query
          required: true
          schema:
            type: string
            format: password
        - name: newpwd
          in: query
          required: true
          schema:
            type: string
            format: password
      responses:
        '200':
          description: Password change result envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalEnvelope'

  /webbooking/services:
    get:
      tags: [WebBooking]
      summary: List bookable services for a company
      security:
        - GymAuthToken: []
      parameters:
        - $ref: '#/components/parameters/AppTokenHeader'
        - $ref: '#/components/parameters/IyesUrlHeader'
        - name: companyID
          in: query
          required: true
          schema:
            type: integer
            example: 2
      responses:
        '200':
          description: Available services envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalEnvelope'

  /webbooking/listwithmine:
    post:
      tags: [WebBooking]
      summary: List lessons and user booking status within a date/time window
      security:
        - GymAuthToken: []
      parameters:
        - $ref: '#/components/parameters/AppTokenHeader'
        - $ref: '#/components/parameters/IyesUrlHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListWithMineRequest'
      responses:
        '200':
          description: Lessons matching the requested window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWithMineResponse'

  /webbooking/mybooks:
    get:
      tags: [WebBooking]
      summary: List current bookings and waitlist entries for the authenticated user
      security:
        - GymAuthToken: []
      parameters:
        - $ref: '#/components/parameters/AppTokenHeader'
        - $ref: '#/components/parameters/IyesUrlHeader'
        - name: companyID
          in: query
          required: true
          schema:
            type: integer
            example: 2
        - name: Type
          in: query
          required: false
          schema:
            type: string
            default: ""
      responses:
        '200':
          description: User bookings envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyBooksResponse'

  /webbooking/book:
    post:
      tags: [WebBooking]
      summary: Reserve a seat in a lesson
      security:
        - GymAuthToken: []
      parameters:
        - $ref: '#/components/parameters/AppTokenHeader'
        - $ref: '#/components/parameters/IyesUrlHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookOrWaitPayload'
      responses:
        '200':
          description: Booking result envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalEnvelope'

  /webbooking/AddWait:
    post:
      tags: [WebBooking]
      summary: Join the waiting list for a full lesson
      security:
        - GymAuthToken: []
      parameters:
        - $ref: '#/components/parameters/AppTokenHeader'
        - $ref: '#/components/parameters/IyesUrlHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookOrWaitPayload'
      responses:
        '200':
          description: Waitlist result envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalEnvelope'

  /webbooking/cancel:
    post:
      tags: [WebBooking]
      summary: Cancel a confirmed booking
      security:
        - GymAuthToken: []
      parameters:
        - $ref: '#/components/parameters/AppTokenHeader'
        - $ref: '#/components/parameters/IyesUrlHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrRemoveWaitPayload'
      responses:
        '200':
          description: Cancellation result envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalEnvelope'

  /webbooking/RemoveWait:
    post:
      tags: [WebBooking]
      summary: Remove the user from a lesson waiting list
      security:
        - GymAuthToken: []
      parameters:
        - $ref: '#/components/parameters/AppTokenHeader'
        - $ref: '#/components/parameters/IyesUrlHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrRemoveWaitPayload'
      responses:
        '200':
          description: Waitlist removal result envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalEnvelope'

  /webuser/me:
    get:
      tags: [WebUser]
      summary: Retrieve the authenticated user's profile
      description: >
        Returns the personal profile and account flags for the currently authenticated user.
        Documented for reference; not currently consumed by `gymClient.ts`.
      security:
        - GymAuthToken: []
      parameters:
        - $ref: '#/components/parameters/AppTokenHeader'
        - $ref: '#/components/parameters/IyesUrlHeader'
      responses:
        '200':
          description: User profile envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebUserMeResponse'

  /user/mystatus:
    get:
      tags: [User]
      summary: Retrieve the authenticated user's informational status tree
      description: >
        Returns a hierarchical text tree (`Documento Informativo`) containing user summary
        sections such as active registrations and bookings (`ISCRIZIONI E PRENOTAZIONI`).
        Documented for reference; not currently consumed by `gymClient.ts`.
      security:
        - GymAuthToken: []
      parameters:
        - $ref: '#/components/parameters/AppTokenHeader'
        - $ref: '#/components/parameters/IyesUrlHeader'
      responses:
        '200':
          description: User status tree envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMyStatusResponse'

  /webepurse/movements:
    get:
      tags: [WebEPurse]
      summary: List movements for a user's electronic purse
      description: >
        Returns movement history for the given `userEPurseID`.
        Documented for reference; not currently consumed by `gymClient.ts`.
      security:
        - GymAuthToken: []
      parameters:
        - $ref: '#/components/parameters/AppTokenHeader'
        - $ref: '#/components/parameters/IyesUrlHeader'
        - name: userEPurseID
          in: query
          required: true
          schema:
            type: integer
            example: 20919
      responses:
        '200':
          description: Electronic purse movements envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EPurseMovementsResponse'

  /webepurse/myepurses:
    get:
      tags: [WebEPurse]
      summary: List electronic purses for the authenticated user
      description: >
        Returns the user's electronic purses, including `UserEPurseID`, current `Balance`,
        and optional `ExpireDate`.
        Documented for reference; not currently consumed by `gymClient.ts`.
      security:
        - GymAuthToken: []
      parameters:
        - $ref: '#/components/parameters/AppTokenHeader'
        - $ref: '#/components/parameters/IyesUrlHeader'
      responses:
        '200':
          description: Electronic purses envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyEPursesResponse'
