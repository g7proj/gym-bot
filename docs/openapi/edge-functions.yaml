openapi: 3.0.3
info:
  title: Gym Bot — Supabase Edge Functions API
  version: 1.0.0
  description: >
    Authenticated serverless proxy endpoints deployed on Supabase Edge Functions (Deno).
    They bridge the React frontend with the external InfoYou TeamSystem gym portal while
    keeping user gym passwords and short-lived portal session tokens (`AuthToken`, 15-minute
    TTL in `public.gym_session_cache`) encrypted at rest with AES-256-GCM.

    All protected endpoints verify the Supabase JWT server-side via `supabaseAdmin.auth.getUser(token)`.
servers:
  - url: http://127.0.0.1:54321/functions/v1
    description: Local Supabase stack (Docker)
  - url: https://{projectRef}.supabase.co/functions/v1
    description: Production Supabase project
    variables:
      projectRef:
        default: your-project-ref
        description: Supabase project reference ID

tags:
  - name: Auth
    description: Credential verification, password sync, and account recovery
  - name: Courses
    description: Weekly course discovery and calendar availability
  - name: Bookings
    description: User bookings, class reservation, waitlist, and cancellation
  - name: Automation
    description: Scheduled machine-to-machine class booking runner
  - name: Notifications
    description: Telegram deep-link account pairing and webhook receiver

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token obtained from `supabase.auth.signInWithPassword` or `signUp`.
    CronBearerAuth:
      type: http
      scheme: bearer
      description: Shared `CRON_SECRET` token verified in constant time by `gym-auto-book`.
    TelegramWebhookSecret:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Api-Secret-Token
      description: Shared `TELEGRAM_WEBHOOK_SECRET` verified in constant time by `telegram-webhook`.

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Unauthorized

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Gym portal username
          example: mario.rossi
        password:
          type: string
          format: password
          description: Gym portal password

    LoginResponse:
      type: object
      required: [user_id, username]
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
          example: mario.rossi

    RecoverRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: mario.rossi
        password:
          type: string
          format: password

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          example: true

    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password

    LessonSlot:
      type: object
      required:
        - weekday
        - course
        - course_label
        - date
        - lesson_start_time
        - lesson_end_time
        - id_service
        - id_lesson
        - available_places
      properties:
        weekday:
          type: string
          enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
        course:
          type: string
          description: Normalized lowercase course name used for exact slot matching
          example: pilates
        course_label:
          type: string
          description: Display course name returned by the gym portal
          example: PILATES
        date:
          type: string
          format: date
          example: "2026-05-12"
        lesson_start_time:
          type: string
          description: Start time in HH:MM:SS
          example: "18:00:00"
        lesson_end_time:
          type: string
          description: End time in HH:MM:SS
          example: "19:00:00"
        id_service:
          type: integer
          example: 55
        id_lesson:
          type: integer
          example: 10123
        available_places:
          type: integer
          example: 8

    CoursesResponse:
      type: object
      required: [by_day]
      properties:
        by_day:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/LessonSlot'

    CalendarEntry:
      type: object
      properties:
        idLesson:
          type: integer
        idService:
          type: integer
        date:
          type: string
          format: date
        startTime:
          type: string
          example: "18:00"
        endTime:
          type: string
          example: "19:00"
        service:
          type: string
          example: PILATES
        category:
          type: string
          example: CORSI FIT
        availablePlaces:
          type: integer
        isUserPresent:
          type: boolean
        waitingListPosition:
          type: integer
        maxBookings:
          type: integer
        webMaxUser:
          type: integer
        isLocked:
          type: integer

    CalendarResponse:
      type: object
      required: [start_date, end_date, days]
      properties:
        start_date:
          type: string
          format: date
          example: "2026-05-01"
        end_date:
          type: string
          format: date
          example: "2026-06-30"
        days:
          type: array
          items:
            type: object
            required: [date, items]
            properties:
              date:
                type: string
                format: date
              items:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarEntry'

    MyBookingEntry:
      type: object
      properties:
        bookingId:
          type: integer
          nullable: true
        idLesson:
          type: integer
          nullable: true
        type:
          type: integer
        idDurata:
          type: integer
        date:
          type: string
          format: date
        startTime:
          type: string
          example: "18:00"
        endTime:
          type: string
          example: "19:00"
        isUserPresent:
          type: boolean
        waitingListPosition:
          type: integer
        service:
          type: string
        category:
          type: string
          example: CORSI FIT
        additionalInfo:
          type: string

    MyBookingsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MyBookingEntry'

    BookLessonRequest:
      type: object
      required: [idService, idLesson, startTime, endTime]
      properties:
        idService:
          type: integer
        idLesson:
          type: integer
        date:
          type: string
          format: date
          description: Optional if startTime/endTime already include full ISO datetime
        startTime:
          type: string
          description: Either HH:MM (paired with date) or YYYY-MM-DDTHH:MM:SS
          example: "18:00"
        endTime:
          type: string
          description: Either HH:MM (paired with date) or YYYY-MM-DDTHH:MM:SS
          example: "19:00"
        type:
          type: integer
          default: 0
        idDurata:
          type: integer
          default: 0
        bookNr:
          type: integer
          default: 0
        availablePlaces:
          type: integer
          description: When > 0 calls `/webbooking/book`; otherwise calls `/webbooking/AddWait`
          default: 0
        waitingListPosition:
          type: integer
          default: 0
        isUserPresent:
          type: boolean
          default: false

    CancelLessonRequest:
      type: object
      required: [bookingId, startTime, endTime]
      properties:
        bookingId:
          type: integer
        idLesson:
          type: integer
          default: 0
        date:
          type: string
          format: date
        startTime:
          type: string
          example: "18:00"
        endTime:
          type: string
          example: "19:00"
        type:
          type: integer
          default: 0
        idDurata:
          type: integer
          default: 0
        isUserPresent:
          type: boolean
          description: When true calls `/webbooking/cancel`; otherwise calls `/webbooking/RemoveWait`

    BookingActionResponse:
      type: object
      required: [success, response]
      properties:
        success:
          type: boolean
          example: true
        response:
          type: object
          description: Raw response payload from the InfoYou API

    AutoBookRequest:
      type: object
      properties:
        dryRun:
          type: boolean
          default: false
          description: Simulate bookings without calling `/webbooking/book` or updating `booking_daily_lock`.
        forceTime:
          type: boolean
          default: false
          description: Bypass the `>= 07:00 Europe/Rome` morning time gate (useful for manual dry-runs).

    AutoBookResponse:
      type: object
      required:
        - success
        - timeZone
        - runDate
        - targetDate
        - targetWeekday
        - dryRun
        - skippedByTimeGate
        - processedUsers
        - bookedCount
        - wouldBookCount
        - failedUsers
        - notifiedUsers
        - results
      properties:
        success:
          type: boolean
          example: true
        timeZone:
          type: string
          example: Europe/Rome
        runDate:
          type: string
          format: date
        targetDate:
          type: string
          format: date
        targetWeekday:
          type: string
          example: wednesday
        dryRun:
          type: boolean
        skippedByTimeGate:
          type: boolean
        processedUsers:
          type: integer
        bookedCount:
          type: integer
        wouldBookCount:
          type: integer
        failedUsers:
          type: integer
        notifiedUsers:
          type: integer
          description: Number of failed users notified via Telegram during this run.
        results:
          type: array
          items:
            type: object
            required: [userId, outcome, slots]
            properties:
              userId:
                type: string
                format: uuid
              outcome:
                type: string
                enum: [completed, dry_run, lock_skipped, no_preferences, no_lessons, failed]
              lockStatus:
                type: string
              error:
                type: string
              slots:
                type: array
                items:
                  type: object
                  required: [course, lessonStartTime, outcome]
                  properties:
                    course:
                      type: string
                    lessonStartTime:
                      type: string
                    lessonId:
                      type: integer
                    outcome:
                      type: string
                      enum: [booked, would_book, already_booked, no_seats, no_match, invalid_slot, failed]
                    detail:
                      type: string

paths:
  /gym-login:
    post:
      tags: [Auth]
      summary: Verify gym credentials and persist encrypted password
      description: >
        Validates credentials against the InfoYou gym portal, encrypts the password using
        AES-256-GCM (`ENCRYPTION_KEY`), and upserts the user profile in `public.users`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credentials verified and persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Gym portal rejected credentials or upstream/DB error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /gym-recover:
    post:
      tags: [Auth]
      summary: Recover Supabase Auth account using valid gym credentials
      description: >
        Unauthenticated endpoint used when a user's gym password changed externally and
        no longer matches their Supabase Auth password. Validates the credentials against
        the gym portal first, then resets the Supabase Auth password and updates `public.users`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoverRequest'
      responses:
        '200':
          description: Supabase Auth password resynchronized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Missing credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Matching Supabase Auth user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Gym login failed or unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /gym-change-password:
    post:
      tags: [Auth]
      summary: Change gym portal password and sync Supabase
      description: >
        Validates `oldPassword` against the gym portal, updates the password on InfoYou,
        then updates Supabase Auth and `public.users.password_encrypted`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password updated everywhere
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Missing password fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User credentials not found in database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Portal rejected password change or upstream error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /gym-courses:
    post:
      tags: [Courses]
      summary: List distinct weekly lesson slots
      description: >
        Fetches `CORSI FIT` classes for a 14-day rolling window starting tomorrow (in `APP_TIMEZONE`,
        default `Europe/Rome`) and returns deduplicated lesson slots grouped by weekday.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Weekly lesson slots grouped by weekday
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursesResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stored user credentials not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Upstream gym API or decryption error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /gym-calendar:
    post:
      tags: [Courses]
      summary: List bookable classes for current and next month
      description: >
        Fetches `CORSI FIT` classes across the current and following calendar month
        and groups them by date (`YYYY-MM-DD`).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Calendar availability grouped by date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stored user credentials not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Upstream gym API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /gym-mybooks:
    post:
      tags: [Bookings]
      summary: List authenticated user's active bookings and waitlist entries
      description: Retrieves the user's current `CORSI FIT` bookings and waitlist positions.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Normalized list of active user bookings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyBookingsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stored user credentials not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Upstream gym API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /gym-book:
    post:
      tags: [Bookings]
      summary: Book a lesson or join its waitlist
      description: >
        Books a seat if `availablePlaces > 0`, otherwise registers the user on the waitlist.
        Rejects requests with `409 Conflict` if `isUserPresent` is true or `waitingListPosition > 0`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookLessonRequest'
      responses:
        '200':
          description: Booking or waitlist request succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingActionResponse'
        '400':
          description: Missing required booking fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stored user credentials not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Already booked or already on waitlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Upstream gym API rejected the booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /gym-cancel:
    post:
      tags: [Bookings]
      summary: Cancel a confirmed booking or leave a waitlist
      description: >
        Calls `/webbooking/cancel` when `isUserPresent` is true, or `/webbooking/RemoveWait`
        when removing a waitlist entry.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelLessonRequest'
      responses:
        '200':
          description: Cancellation succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingActionResponse'
        '400':
          description: Missing required cancel fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stored user credentials not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Upstream gym API rejected the cancellation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /gym-auto-book:
    post:
      tags: [Automation]
      summary: Run automated daily bookings for all users
      description: >
        Machine-to-machine endpoint invoked by `.github/workflows/book.yml`.
        Validates `Authorization: Bearer <CRON_SECRET>`, enforces the `>= 07:00 Europe/Rome`
        time gate, acquires per-user daily locks (`acquire_booking_lock`), and books exact
        preferred lesson slots on `today + 19`.
      security:
        - CronBearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoBookRequest'
      responses:
        '200':
          description: Automated booking run summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoBookResponse'
        '401':
          description: Missing or invalid `CRON_SECRET`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Missing server configuration or database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /telegram-link:
    post:
      tags: [Notifications]
      summary: Generate a single-use Telegram deep link or disconnect error alerts
      description: >
        When `action` is `"create"` (default), stores a short-lived SHA-256 hashed token in
        `public.telegram_link_tokens` and returns `https://t.me/<bot>?start=<token>`.
        When `action` is `"disconnect"`, deletes the user's `public.telegram_connections` record.
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [create, disconnect]
                  default: create
      responses:
        '200':
          description: Deep-link payload or disconnect confirmation
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [url, bot_username, expires_at, expires_in_seconds]
                    properties:
                      url:
                        type: string
                        example: https://t.me/gym_bot?start=AbCdEf1234567890_XyZ9876543210ab
                      bot_username:
                        type: string
                        example: gym_bot
                      expires_at:
                        type: string
                        format: date-time
                      expires_in_seconds:
                        type: integer
                        example: 900
                  - $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Telegram bot token not configured on server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /telegram-webhook:
    post:
      tags: [Notifications]
      summary: Receive Telegram Bot updates for `/start <token>` and `/stop`
      description: >
        Validates `X-Telegram-Bot-Api-Secret-Token` in constant time against `TELEGRAM_WEBHOOK_SECRET`,
        consumes single-use deep-link tokens from `public.telegram_link_tokens`, and links or unlinks
        `public.telegram_connections`.
      security:
        - TelegramWebhookSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Telegram Bot API Update payload
      responses:
        '200':
          description: Update processed
          content:
            application/json:
              schema:
                type: object
                required: [ok, action]
                properties:
                  ok:
                    type: boolean
                    example: true
                  action:
                    type: string
                    example: connected
        '401':
          description: Missing or invalid `X-Telegram-Bot-Api-Secret-Token`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
